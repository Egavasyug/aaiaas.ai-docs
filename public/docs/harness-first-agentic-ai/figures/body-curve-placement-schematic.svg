<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 495" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d1b2a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="495" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="26" text-anchor="middle" font-size="15" fill="#0d1b2a" font-weight="600">Most Agent Work Saturates on Mid-Size Local Models</text>

  <!-- Subtitle callout -->
  <text x="370" y="46" text-anchor="middle" font-size="11" fill="#0d1b2a" font-weight="600" font-style="italic">Volume: local mid-size (workers / talons) covers the plateau</text>

  <!-- Axes -->
  <line x1="80" y1="420" x2="700" y2="420" stroke="#0d1b2a" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="420" stroke="#0d1b2a" stroke-width="1.5"/>

  <!-- X-axis label -->
  <text x="390" y="450" text-anchor="middle" font-size="13" fill="#333">Scale (parameters · data · compute)</text>

  <!-- Y-axis label (rotated) -->
  <text x="25" y="240" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90, 25, 240)">Task Success on a Fixed Mix</text>

  <!-- Main curve: rising then flattening -->
  <path d="M 85 410
           C 85 410, 120 395, 160 370
           C 200 345, 240 300, 290 250
           C 340 200, 380 180, 430 170
           C 480 160, 530 155, 580 155
           C 630 155, 670 158, 690 160"
        fill="none" stroke="#0d1b2a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hard-tail continuation (slight rise, dashed) -->
  <path d="M 580 155
           C 630 155, 670 158, 690 160"
        fill="none" stroke="#0d1b2a" stroke-width="2.5" stroke-dasharray="8,4" stroke-linecap="round"/>

  <!-- Plateau region shading -->
  <rect x="430" y="150" width="260" height="270" fill="#f0f4f8" opacity="0.3" rx="4"/>

  <!-- Plateau note: extra scale diminishing returns (in plateau band, below curve) -->
  <text x="520" y="230" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">Extra scale helps less on the common case</text>

  <!-- Residual control plane annotation (tiny/soft, right edge) -->
  <text x="695" y="130" text-anchor="end" font-size="9" fill="#9ca3af">Residual → control-plane</text>
  <line x1="690" y1="127" x2="690" y2="160" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Tick/dot at curve onset for local workers (x≈440, y≈170) -->
  <circle cx="440" cy="169" r="3" fill="#0d1b2a"/>
  <line x1="440" y1="169" x2="440" y2="174" stroke="#0d1b2a" stroke-width="1"/>

  <!-- Annotation: local workers on plateau (high success, at plateau onset, under flat curve) -->
  <rect x="375" y="174" width="130" height="22" fill="#e8edf2" rx="3" stroke="#0d1b2a" stroke-width="0.5"/>
  <text x="440" y="189" text-anchor="middle" font-size="9" fill="#333">
    <tspan x="440" dy="0">Local workers &amp; talons</tspan>
    <tspan x="440" dy="12">(mid-size · high success)</tspan>
  </text>

  <!-- Dashed separator: body vs. control-plane -->
  <line x1="430" y1="60" x2="430" y2="150" stroke="#0d1b2a" stroke-width="0.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Caption -->
  <text x="370" y="472" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">
    For the bulk of production agent work, quality gains flatten while cost and latency keep rising. Sweet-spot local models
  </text>
  <text x="370" y="485" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">
    on workers cover that plateau; frontier capacity is not the default volume path.
  </text>
</svg>
